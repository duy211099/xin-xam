<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props

function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;
}
// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){
    let s = sceneFn.apply(this, arguments);
    const st = opts.getSt(), k = ease(st.xr || 0);
    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case
    const items = k > .6 ? opts.inside(st) : opts.surface ? opts.surface(st) : [];
    return s + (items.length ? xrCallouts(items, opts.B) : '');
  };
}

/* ---------- game keypad: mountKeypad({ rows, hub:[col,row], action:'DROP', keys:[{ key:'ArrowLeft', glyph:'\u25c0', name, at:[col,row] }] })
   An inked pad under the buttons that sends the same keyboard events as the arrows and space (set window.GAME_KEYS = true
   so the arrows play instead of turning the camera). ---------- */
function mountKeypad(spec){
  const host = document.getElementById('btns'); if (!host) return;
  const css = document.createElement('style');
  css.textContent = `.kpad{display:flex;align-items:center;gap:16px;margin-top:6px;padding:10px 12px;border:1.5px solid var(--ink);border-radius:14px;
      background:var(--paper);box-shadow:0 3px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
    .kpad .dp{display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(var(--rows),34px);gap:3px}
    .kpad .k{all:unset;box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:34px;height:34px;cursor:pointer;
      background:#fbf7ea;border:1.5px solid var(--ink);border-radius:7px;box-shadow:0 3px 0 var(--ink);color:var(--ink);font:700 13px ui-monospace,Menlo,monospace;
      transition:transform .05s,box-shadow .05s,background .05s}
    .kpad .hub{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
    .kpad .hub i{width:12px;height:12px;border-radius:50%;border:1.5px solid var(--ink);background:#e6e0d1}
    .kpad .go{all:unset;box-sizing:border-box;width:62px;height:62px;border-radius:50%;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
      background:#e2483d;border:1.5px solid var(--ink);box-shadow:0 4px 0 var(--ink),inset 0 -5px 0 rgba(0,0,0,.18);color:#fff;font:800 12px ui-monospace,Menlo,monospace;letter-spacing:.06em;
      transition:transform .05s,box-shadow .05s}
    .kpad .go small{font:700 8px ui-monospace,Menlo,monospace;opacity:.85;letter-spacing:.08em;margin-top:2px}
    .kpad .down{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
    .kpad .k.down{background:var(--accent,#f4b829)}
    .kpad .go.down{transform:translateY(3px);box-shadow:0 1px 0 var(--ink),inset 0 -3px 0 rgba(0,0,0,.18)}
    @media (max-width:560px){.kpad{gap:22px;padding:10px 16px}.kpad .dp{grid-template-columns:repeat(3,44px);grid-template-rows:repeat(var(--rows),44px)}
      .kpad .k,.kpad .hub{width:44px;height:44px;font-size:15px}.kpad .go{width:74px;height:74px}}`;
  document.head.appendChild(css);
  const pad = document.createElement('div'); pad.className = 'kpad'; pad.setAttribute('role', 'group'); pad.setAttribute('aria-label', 'Keypad');
  const dp = document.createElement('div'); dp.className = 'dp'; dp.style.setProperty('--rows', spec.rows);
  const els = {};
  for (const k of spec.keys){
    const b = document.createElement('button'); b.className = 'k'; b.textContent = k.glyph; b.setAttribute('aria-label', k.name);
    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

</script>
<script>
/* =====================================================================================================
   Máy xin xăm, a virtual temple fortune machine.  A coin-operated fortune machine, not a stick shaker.

   TRUTH FIRST (from the visitor's photo; marked * = not verified, a reasoned guess):
   1. Coin: lies in a gold ingot-shaped bowl on the donation stand beside the machine, next to the Di Lặc statue.
   2. Pray in front of the machine (no mechanism).
   3. Coin goes into the slot of the black acceptor on the lower right of the front → acceptor checks it* →
      falls through a chute* into a cash box* on the floor of the cabinet.
   4. The controller* runs the machine: the lights over the row of 8 gold figurines in the glass case come on
      (a chase that stops on one figurine is our guess*), a motor* turns a rotor* under a hopper* of capsules.
   5. One yellow plastic capsule leaves the rotor, rolls down a trough* and pushes open the small red flap on
      the front; it drops into the tray under the flap.
   6. The visitor takes the capsule, pulls the two halves apart and unrolls the paper slip (LINH XĂM, number).
   Where things are after each step: coin bowl → hand → slot → acceptor* → chute* → cash box*.
                                     capsule hopper* → rotor* → trough* → flap → tray → hand → open → slip.

   COORDINATES: x = depth (front face x = 45), y = width (+y = viewer-left), z = up. 1 unit = 1 cm.
   The machine stands at y 52..114, the donation stand at y 2..42 (viewer-right of it, as in the photo).

   PARTS LIST
   case:       plinth, red cabinet body, frieze with gold 靈籤舍 sign, gold cornice, gold hip roof, ridge, pearl,
               eave tips, glass case (back wall, side walls, floor, glass, gold frame), gold band, side insets,
               back service door with lock and vents, mains cord and plug
   glass case: Quan Âm painting, small red shrine with gold roof, red step, 8 gold figurines, LED strip
   front:      MÁY XIN XĂM notice, price tag, coin acceptor (plate, slot, LED, return button), red flap with
               gold frame and hinge rod, dark opening, gold tray with lips
   mechanism*: capsule hopper (clear), funnel, rotor, motor, motor bracket, hopper bracket, mounting plate,
               4 standoffs, trough with side walls and support rod, photo-gate sensor pair, acceptor body,
               coin sensor board, coin chute, cash box
   power*:     PSU on the floor, controller PCB with chips on the back wall, speaker on the side wall,
               wires: PSU→PCB, PCB→acceptor, PCB→motor, PCB→speaker, PCB→LED strip, mains→PSU
   stand:      wooden donation box, TÙY HỶ CÔNG ĐỨC sign, donation slot, Di Lặc (jade), gold ingot coin bowl
               with coins, bronze incense burner with 3 sticks
   ===================================================================================================== */

const XW = 45, YA = 52, YB = 114, PLT = 6, CTOP = 150;
const RED  = { l:'#e8513a', m:'#c8321f', d:'#6e1a10' }, GOLD = { l:'#f7d774', m:'#d6a53a', d:'#8c6418' };
const LACQ = { l:'#7a4630', m:'#4a2617', d:'#2a150c' }, JADE = { l:'#c9ecdd', m:'#8fc9b4', d:'#5a9a84' };
const BRONZE = { l:'#c99a5a', m:'#9a6c34', d:'#5a3c18' }, PCBM = { l:'#4fa36d', m:'#2f7d4f', d:'#1b4a2e' };
const BRASS = { l:'#f0d37a', m:'#c9a24a', d:'#8a6a24' }, PAPER = { l:'#fffaf0', m:'#f1e6cc', d:'#cdbf9f' };
const ctSERIF = "'Noto Serif','Times New Roman',Georgia,serif", ctCJK = "'Songti TC','PingFang TC','Noto Serif CJK TC','Noto Serif TC',serif";
const OUTP = rrUV(YA, PLT, YB, CTOP, 1.2);
const ctCase = { y0:57, y1:109, z0:100, z1:146, xb:6 };
const ctFl = { y0:71, y1:85, z0:67, z1:76 };
const ctTrZ = x => 73 - 5*(Math.min(x, 45) - 24)/21;          // trough floor height
const ctFigY = i => 61 + i*6.2;                                 // the 8 figurines
const ctHC = [57, 80, 100], ctHS = 2.4;                         // capsule held in the hand: centre, scale
const ctRM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } })();

/* ---------- small helpers ---------- */
const ctLerp = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const ctCl = v => Math.max(0, Math.min(1, v));
const ctBox = (x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9) => ({ box:[[x0,y0,z0],[x1,y1,z1]], svg: box(x0,y0,z0,x1,y1,z1,m,shade,w) });
const ctBoxOf = pts => [[0,1,2].map(i => Math.min(...pts.map(p => p[i])) - .6), [0,1,2].map(i => Math.max(...pts.map(p => p[i])) + .6)];
const ctRX = (x, y0, z0, y1, z1) => on(PX(x), rectUV(y0, z0, y1, z1));
const ctRY = (y, x0, z0, x1, z1) => on(PY(y), rectUV(x0, z0, x1, z1));
const ctText = (o, U, V, str, size, col, fam, weight) => `<text transform="${txM(P(...o), U, V)}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="${fam}" font-weight="${weight}">${str}</text>`;
const ctTxX = (x,y,z,str,size,col=INK,weight=700,fam=ctSERIF) => ctText([x,y,z], Dv(0,-1,0), Dv(0,0,-1), str, size, col, fam, weight);
const ctTxB = (x,y,z,str,size,col=INK,weight=700,fam=ctSERIF) => ctText([x,y,z], Dv(0,1,0), Dv(0,0,-1), str, size, col, fam, weight);
const ctWire = (pts, col, w = .45) => { const d = pd(pts, false), [a, b] = [P(...pts[0]), P(...pts[pts.length - 1])];
  return { box: ctBoxOf(pts), svg: `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${f(2*w + .9)}" stroke-linejoin="round" stroke-linecap="round"/><path d="${d}" fill="none" stroke="${col}" stroke-width="${f(2*w)}" stroke-linejoin="round" stroke-linecap="round"/>`
    + [a, b].map(([X, Y]) => `<circle cx="${f(X)}" cy="${f(Y)}" r="1" fill="${INK}"/>`).join('') }; };
// a ball (head, pearl): a circle with a lit cap
const ctBall = (c, r, m, w = .9) => { const [X, Y] = P(...c), R = CAM_K*r;
  return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="${m.m}"/><circle cx="${f(X - R*.28)}" cy="${f(Y - R*.3)}" r="${f(R*.55)}" fill="${m.l}"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="none" stroke="${INK}" stroke-width="${w}"/>`; };
const ctStroke = (pts, col, w, close = true, extra = '') => `<path d="${pd(pts, close)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;

/* ---------- the capsule: two halves along y, yellow cap on +y; sc = scale; off = how far the cap is pulled off ---------- */
function ctCapsule(c, sc = 1, off = 0, roll = 0){
  const r = 1.8*sc, h = 2.7*sc, A = [c[0], c[1] - h, c[2]], B = [c[0], c[1] + h + off, c[2]];
  const circ = (p, rr) => { const q = P(...p); return Array.from({ length:20 }, (_, i) => { const a = i/20*2*Math.PI; return [q[0] + CAM_K*rr*Math.cos(a), q[1] + CAM_K*rr*Math.sin(a)]; }); };
  const ring = y => on(PY(y), ellUV(c[0], c[2], r, r, 20));
  const ringS = y => ring(y).map(p => P(...p));
  const w = Math.min(1.6, .7 + .25*sc);
  const halfC = () => { const hp = hull([...circ(A, r), ...ringS(c[1])]); return fill(sp(hp), '#f6efd8') + ink(sp(hp), w); };
  const halfY = () => { const hp = hull([...ringS(c[1] + off), ...circ(B, r)]); return fill(sp(hp), '#f4c430') + ink(sp(hp), w); };
  const open = off > .15*sc;
  // open mouths: the cream half's mouth faces +y, the cap's faces -y
  const mouthC = () => open && vis([0,1,0]) ? fill(pd(ring(c[1])), '#c9b98e') + (roll ? fill(pd(on(PY(c[1] + .05), ellUV(c[0], c[2], r*.45, r*.45, 14))), PAPER.l) : '') + ink(pd(ring(c[1])), w*.7) : '';
  const mouthY = () => open && vis([0,-1,0]) ? fill(pd(ring(c[1] + off)), '#b98d12') + ink(pd(ring(c[1] + off)), w*.7) : '';
  // seam ring: only the near half of the band
  const v = [CAM_V[0], CAM_V[2]], a0 = Math.atan2(v[1], v[0]);
  const seam = open ? '' : ctStroke(Array.from({ length:13 }, (_, i) => { const a = a0 - Math.PI/2 + i/12*Math.PI; return [c[0] + r*Math.cos(a), c[1] + .05, c[2] + r*Math.sin(a)]; }), INK, w*.6, false);
  const hl = `<path d="${pd([[A[0], A[1], A[2] + r*.62], [B[0], B[1], B[2] + r*.62]], false)}" stroke="#fff" stroke-opacity=".7" stroke-width="${f(.55*sc)}" stroke-linecap="round" fill="none"/>`;
  const plusNear = vis([0,1,0]);
  return plusNear ? halfC() + mouthC() + halfY() + mouthY() + seam + hl : halfY() + mouthY() + halfC() + mouthC() + seam + hl;
}
// a coin standing on edge in the x-z plane (it goes into a slot that is narrow along y)
const ctCoin = c => rod([c[0], c[1] - .17, c[2]], [c[0], c[1] + .17, c[2]], 1.3, BRASS, toneI, .8, 1.3, 18);

/* ---------- glass case contents (seen through the front glass, clipped to the opening) ---------- */
function ctFigurine(i, lit){
  const y = ctFigY(i), x = 35.5, m = lit ? { l:'#fff6c8', m:'#ffd95a', d:'#c98f1c' } : GOLD;
  const A = on(PZ(105.4), ellUV(x, y, 1.5, 1.5, 14)), B = on(PZ(109.2), ellUV(x, y, 1.3, 1.3, 14)), Cc = on(PZ(111.8), ellUV(x, y, .85, .85, 14));
  const [X, Y] = P(x, y, 109);
  const glow = lit ? `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(CAM_K*5)}" fill="#ffe9a0" opacity=".55"/>` : '';
  const svg = glow + box(x - 1.2, y - 1.3, 104, x + 1.2, y + 1.3, 105.4, GOLD, toneI, .6)
    + loft(A, B, n => toneI(n, m)) + loft(B, Cc, n => toneI(n, m)) + hullInk([...A, ...B, ...Cc], .9) + ctBall([x, y, 113], 1.3, m, .8);
  return { box:[[x - 1.6, y - 1.6, 104], [x + 1.6, y + 1.6, 114.5]], svg };
}
function ctCaseView(st){
  const c = ctCase, x1 = XW, lit = st.phase === 'run' || st.lit >= 0;
  let s = '';
  // inner walls by inward normal
  s += fill(pd(ctRX(c.xb, c.y0, c.z0, c.y1, c.z1)), '#7a1c12');
  if (vis([0,1,0])) s += fill(pd(ctRY(c.y0, c.xb, c.z0, x1, c.z1)), '#922616');
  if (vis([0,-1,0])) s += fill(pd(ctRY(c.y1, c.xb, c.z0, x1, c.z1)), '#922616');
  if (vis([0,0,1])) s += fill(pd(on(PZ(c.z0), rectUV(c.xb, c.y0, x1, c.y1))), '#5a140c');
  if (vis([0,0,-1])) s += fill(pd(on(PZ(c.z1), rectUV(c.xb, c.y0, x1, c.y1))), '#5a140c');
  // Quan Âm painting on the back wall
  const pp = PX(c.xb + .05);
  s += shape(on(pp, rrUV(70, 112, 96, 144, 1.5)), '#f3e6c4', .8)
    + fill(pd(on(pp, ellUV(83, 136.5, 5.5, 5.5, 22))), '#f2c94c') + ink(pd(on(pp, ellUV(83, 136.5, 5.5, 5.5, 22))), .5)
    + shape(on(pp, [[83, 133.5], [88.5, 127], [90, 115], [76, 115], [77.5, 127]]), '#fbfaf3', .6)
    + shape(on(pp, ellUV(83, 136, 2.3, 2.6, 16)), '#f6dcc0', .6)
    + shape(on(pp, ellUV(83, 115, 8.5, 1.8, 18)), '#f2a6a0', .6)
    + ink(pd(on(pp, [[80.5, 124], [83, 121], [85.5, 124]]), false), .5);
  // contents, sorted
  const parts = [];
  // shrine: red box, gold roof, door and plaque
  const sh = box(10, 75, 100, 22, 91, 115, RED, toneI, .9)
    + loft(on(PZ(115), rectUV(9, 74, 23, 92)), on(PZ(119), rectUV(13, 79, 19, 87)), n => toneI(n, GOLD)) + fill(pd(on(PZ(119), rectUV(13, 79, 19, 87))), GOLD.l)
    + hullInk([...on(PZ(115), rectUV(9, 74, 23, 92)), ...on(PZ(119), rectUV(13, 79, 19, 87))], 1)
    + (vis([1,0,0]) ? shape(ctRX(22.05, 80, 101, 86, 107.5), '#3a0d08', .6) + shape(ctRX(22.05, 79, 109, 87, 113), GOLD.l, .6) : '');
  parts.push({ box:[[9, 74, 100], [23, 92, 119]], svg: sh });
  parts.push(ctBox(30, 58, 100, 41, 108, 104, RED, toneI, .8));
  for (let i = 0; i < 8; i++) parts.push(ctFigurine(i, st.lit === i));
  const led = lit ? { l:'#fffbe0', m:'#fff1b8', d:'#e8d58a' } : { l:'#efe8d2', m:'#d9d1b8', d:'#b5ad95' };
  parts.push(ctBox(40, 58, 144, 43, 108, 145.5, led, toneI, .6));
  s += byDepth(parts);
  if (lit) s += fill(pd(ctRX(x1, c.y0, c.z0, c.y1, c.z1)), '#ffd76a', 'opacity=".13"');
  // glass: a faint tint and two streaks
  s += fill(pd(ctRX(x1, c.y0, c.z0, c.y1, c.z1)), '#cfe9f0', 'opacity=".16"')
    + fill(pd(on(PX(x1), [[100, 146], [106, 146], [86, 100], [80, 100]])), '#ffffff', 'opacity=".38"')
    + fill(pd(on(PX(x1), [[78, 146], [80, 146], [60, 100], [58, 100]])), '#ffffff', 'opacity=".3"');
  return clipTo(ctRX(x1, c.y0, c.z0, c.y1, c.z1), s);
}

/* ---------- the machine ---------- */
function ctFlapAngle(st){
  if (st.phase !== 'disp') return 0;
  const u = st.t/ctDur('disp'); return u > .55 && u < .8 ? 62*Math.sin(Math.PI*(u - .55)/.25) : 0;
}
function ctFlap(st){
  const a = ctFlapAngle(st)*Math.PI/180, L = ctFl.z1 - ctFl.z0, n = [Math.cos(a), 0, -Math.sin(a)];
  const hy0 = ctFl.y0 + .3, hy1 = ctFl.y1 - .3, bx = XW + L*Math.sin(a), bz = ctFl.z1 - L*Math.cos(a), t = .6;
  const o = [n[0]*t, 0, n[2]*t];
  const inner = [[XW, hy0, ctFl.z1], [XW, hy1, ctFl.z1], [bx, hy1, bz], [bx, hy0, bz]], outer = inner.map(p => [p[0] + o[0], p[1], p[2] + o[2]]);
  const faceOut = vis(n);
  const side = (y) => [[XW, y, ctFl.z1], [bx, y, bz], [bx + o[0], y, bz + o[2]], [XW + o[0], y, ctFl.z1 + o[2]]];
  let s = '';
  s += vis([0,1,0]) ? shape(side(hy1), RED.d, .6) : shape(side(hy0), RED.d, .6);
  s += shape([[bx, hy0, bz], [bx, hy1, bz], [bx + o[0], hy1, bz + o[2]], [bx + o[0], hy0, bz + o[2]]], RED.m, .6);
  s += faceOut ? shape(outer, tone(n, RED), 1.1) : shape(inner, RED.d, 1.1);
  if (faceOut && a < .05) s += shape(on(PX(XW + o[0] + .05), rectUV(76, 69, 80, 70.5)), GOLD.l, .5);   // pull lip
  return { box: ctBoxOf([...inner, ...outer]), svg: s };
}
function ctCapsuleAt(st){
  if (st.phase === 'disp'){

/* ---------- the capsule in the hand, opened, and the slip ---------- */
function ctHeld(st){

  if (ph === 'fade') alpha = 1 - ctCl(st.t/ctDur('fade'));

function ctSheet(x, y0, y1, z0, z1, u, st){

/* ---------- the coin's path: bowl → hand → slot → acceptor* → chute* → cash box* ---------- */
const ctCoinPath = [[34, 34, 82.6], [37, 40, 92], [50, 56, 84], [52, 60.5, 74], [48.9, 60.5, 73], [44, 60.5, 73], [38, 60.5, 73], [38, 60.5, 52], [30, 60.5, 29.5], [30, 60.5, 27]];
function ctCoinAt(st){
  if (st.phase !== 'coin') return null;

  let tot = 0; for (let i = 1; i < P1.length; i++){ const d = Math.hypot(...sub(P1[i], P1[i - 1])); seg.push(d); tot += d; }

}

/* ================= fortune data (independent of the drawing) ================= */
const ctData = (() => {
  const clean = v => (typeof v === 'string' ? v : typeof v === 'number' ? String(v) : '').slice(0, 2000);
  const lines = v => (Array.isArray(v) ? v : clean(v).split('\n')).map(clean).filter(Boolean);
  let cols = [], notice = '';
  function normCol(c, i, defSample){
    const list = Array.isArray(c.fortunes) ? c.fortunes : Array.isArray(c.entries) ? c.entries : [];
    const total = Math.max(1, Math.min(500, ((+(c.total ?? c.stickCount)) | 0) || Math.max(1, ...list.map(e => (+e.number) | 0))));
    const sample = c.sample === true || (c.sample == null && defSample), map = new Map();
    for (const e of list){ const n = (+e.number) | 0; if (n < 1 || n > total) continue;
      map.set(n, { number:n, title:clean(e.title), poem:lines(e.poem), interpretation:clean(e.interpretation ?? e.explanation), category:clean(e.category), advice:clean(e.advice), sample: sample || e.sample === true }); }
    return { id: clean(c.collection ?? c.id) || 'c' + i, name: clean(c.name) || 'Bộ xăm ' + (i + 1), total, sample, map };
  }
  function load(json, defSample = false){
    const arr = json && Array.isArray(json.collections) ? json.collections : json && (Array.isArray(json.fortunes) || Array.isArray(json.entries)) ? [json] : null;
    if (!arr || !arr.length) throw new Error('no collections');
    const out = arr.map((c, i) => normCol(c, i, defSample));
    cols = out; notice = clean(json.notice);
  }
  load(JSON.parse(document.getElementById('ct-fortunes').textContent), true);
  // the server sends every number; this page alone (opened as a file) has only a few written ones
  function entry(ci, n){
    const col = cols[ci] || cols[0];
    if (col.map.has(n)) return { ...col.map.get(n) };
    return { number:n, title:'', poem:[], interpretation:'Bộ xăm này chưa có nội dung cho quẻ số ' + n + '.', category:'', advice:'', sample:true };
  }
  const index = key => { const i = cols.findIndex(c => c.id === key); return i >= 0 ? i : /^\d+$/.test(key) ? Math.min(cols.length - 1, +key) : -1; };
  return { get cols(){ return cols; }, get notice(){ return notice; }, col: i => cols[i] || cols[0], load, entry, index };
})();
// the number is drawn once per run, from the browser's crypto source, without modulo bias
const ctPick = n => { const c = globalThis.crypto; if (!c || !c.getRandomValues) return 1 + Math.floor(Math.random()*n);
  const lim = Math.floor(0x100000000/n)*n, buf = new Uint32Array(1); do c.getRandomValues(buf); while (buf[0] >= lim); return 1 + (buf[0] % n); };

/* ================= sound: synthesized with WebAudio; nothing plays before a press ================= */
const ctSound = (() => {
  const NAMES = ['Tắt', 'Nhỏ', 'Vừa', 'Lớn'], GAINS = [0, .3, .55, .85];
  let level = 2, ctx = null, out = null, noiseBuf = null, motor = null;
  try { const v = localStorage.getItem('chuatau.sound'); if (v != null && GAINS[+v] != null) level = +v; } catch {}
  function ac(){ if (!level) return null;
    try { if (!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        ctx = new AC(); out = ctx.createGain(); out.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate*.5, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
      out.gain.value = GAINS[level]; if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch { return null; } }
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); };

  function noise(fc, q, peak, d, when = 0){ const c = ac(); if (!c) return;
    const t = c.currentTime + when, s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = fc; bp.Q.value = q; env(g, t, .002, peak, d); s.connect(bp).connect(g).connect(out); s.start(t, Math.random()*.3); s.stop(t + d + .05); }

  return {
    NAMES, get level(){ return level; },
    set(v){ level = v; try { localStorage.setItem('chuatau.sound', String(v)); } catch {} if (!level) this.motor(0); else if (out) out.gain.value = GAINS[level]; },
    pray(){ bell(330, .22, 3.6); bell(330, .18, 3.2, 1.6); },
    pick(){ noise(3200, 5, .12, .04); osc(1900, 'sine', .06, .001, .12); },
    coin(){ osc(2093, 'sine', .14, .001, .35); osc(3136, 'sine', .08, .001, .25); },
    drop(){ for (let i = 0; i < 4; i++) noise(4200 - i*500, 7, .14 - i*.025, .04, i*.07); osc(900, 'triangle', .06, .001, .08, .3); },
    tick(){ osc(1320, 'square', .02, .002, .03); },
    bell(){ bell(523, .2, 2.4); },
    roll(){ noise(700, 1.5, .1, .5); for (let i = 0; i < 6; i++) noise(1500, 6, .05, .03, i*.08); },
    flap(){ noise(1100, 3, .14, .06); osc(260, 'triangle', .1, .002, .08); },
    clack(){ noise(2600, 4, .22, .05); osc(780, 'triangle', .14, .001, .07); noise(2600, 4, .1, .04, .14); },
    take(){ noise(1100, 2, .12, .18); },
    pop(){ osc(420, 'sine', .2, .002, .1, 0, 220); noise(3000, 3, .1, .04); },
    paper(){ noise(3000, 1.2, .07, .45); for (let i = 0; i < 8; i++) noise(5200, 2, .03, .03, .05 + i*.06); },
    close(){ noise(700, 3, .12, .1); },
    motor(lv){ const c = lv > 0 ? ac() : ctx; if (!c) return;
      if (!motor && lv > 0){ const o = c.createOscillator(), o2 = c.createOscillator(), lp = c.createBiquadFilter(), g = c.createGain();
        o.type = 'sawtooth'; o.frequency.value = 50; o2.type = 'square'; o2.frequency.value = 100; lp.type = 'lowpass'; lp.frequency.value = 340; g.gain.value = 0;
        o.connect(lp); o2.connect(lp); lp.connect(g).connect(out); o.start(); o2.start(); motor = { o, o2, g }; }
      if (!motor) return;
      motor.g.gain.setTargetAtTime(.1*lv, c.currentTime, .08);
      if (lv <= 0){ const m = motor; motor = null; setTimeout(() => { try { m.o.stop(); m.o2.stop(); } catch {} }, 500); } },
  };
})();

/* ================= the ritual: one state object, one frame driver ================= */
const ctDurs = { coin: [1.8, 1.0], run: [3.2, 1.6], disp: [1.9, 1.1], taking: [.9, .4], opening: [1.6, .7], fade: [.5, .3] };
const ctDur = ph => (ctDurs[ph] || [0, 0])[ctRM ? 1 : 0];
const ctMsg = { coin:'Đang tiếp nhận đồng xu...', run:'Máy đang vận hành...', out:'Quẻ xăm của bạn đã được xuất ra' };
const ctState = { phase:'idle', t:0, num:0, col:0, lit:-1, prayed:false, chosen:false, read:false, queue:'', ev:{}, chase:-1 };
let ui = null, ctLoop = false;
function ctGo(ph){ const st = ui.st; st.phase = ph; st.t = 0; st.ev = {}; ctRun(); }
function ctRun(){ if (ctLoop) return; ctLoop = true; ui.animate(ctTick); }
function ctTick(dt){
  const st = ui.st, T = ctDur(st.phase);
  if (!T){ ctLoop = false; return false; }
  st.t += dt;
  const ev = (name, cond, fn) => { if (cond && !st.ev[name]){ st.ev[name] = 1; fn(); } };
  if (st.phase === 'coin'){
    ev('pick', true, () => ctSound.pick());
    ev('slot', st.t > T*.62, () => ctSound.coin());
    ev('drop', st.t > T*.8, () => ctSound.drop());
  }
  if (st.phase === 'run'){
    ev('hum', true, () => ctSound.motor(1));
    const target = (st.num - 1) % 8, N = 16 + target, x = ctCl(st.t/T), i = Math.min(N, Math.floor((1 - Math.pow(1 - x, 3))*N + .0001));
    if (i !== st.chase){ st.chase = i; st.lit = i % 8; ctSound.tick(); }
  }
  if (st.phase === 'disp'){
    const u = st.t/T;
    ev('roll', u > .22, () => ctSound.roll());
    ev('flap', u > .58, () => ctSound.flap());
    ev('clack', u > .8, () => ctSound.clack());
  }
  if (st.t < T) return true;
  // end of a timed phase
  const ph = st.phase;
  if (ph === 'coin'){ ctGo('run'); ui.flash(ctMsg.run, 2200); }
  else if (ph === 'run'){ ctSound.motor(0); ctSound.bell(); st.lit = (st.num - 1) % 8; ctGo('disp'); }
  else if (ph === 'disp'){ st.phase = 'ready'; st.t = 0; ui.flash(ctMsg.out, 2400); }
  else if (ph === 'taking'){ st.phase = 'held'; st.t = 0; if (st.queue){ ctGo('opening'); ctSound.pop(); } }
  else if (ph === 'opening'){ st.phase = 'opened'; st.t = 0; if (st.queue === 'read'){ st.queue = ''; ctOpenModal(); } else st.queue = ''; }
  else if (ph === 'fade'){ Object.assign(st, { phase:'idle', t:0, num:0, lit:-1, chase:-1, queue:'', prayed:false, read:false }); }
  ui.drawStats && ui.drawStats();
  if (ctDur(st.phase)) return true;
  ctLoop = false; return false;
}
const ctCan = { pray: ph => ph === 'idle' };
function ctPray(st){
  if (st.phase !== 'idle') return ui.flash('Đang xin xăm, hãy làm tiếp các bước.');
  st.prayed = st.chosen = true; ctSound.pray(); ctSmokeBurst(); ui.flash('Nhẩm điều mong cầu trong lòng, rồi bắt đầu xin xăm.', 2400);
}
function ctStart(st){
  if (st.phase !== 'idle'){ return ui.flash(st.phase === 'ready' ? 'Quẻ đã ra, hãy nhấn để lấy quẻ.' : st.phase === 'coin' || st.phase === 'run' || st.phase === 'disp' ? ctMsg.run : 'Hãy đọc xong quẻ, rồi xin xăm lại.'); }
  st.chosen = true; if (!st.prayed){ st.prayed = true; ctSound.pray(); ctSmokeBurst(); }
  st.num = ctPick(ctData.col(st.col).total); st.lit = -1; st.chase = -1; st.queue = '';
  ctGo('coin'); ui.flash(ctMsg.coin, 1800);
}
function ctTake(st){

  if (st.phase === 'idle') ui.flash('Chưa có quẻ. Hãy bắt đầu xin xăm.');
  else if (st.phase === 'coin' || st.phase === 'run' || st.phase === 'disp') ui.flash(ctMsg.run);
  else ui.flash('Quẻ đã ở trong tay.');

}
function ctOpen(st, then = ''){
  if (st.phase === 'held'){ st.queue = then; ctSound.pop(); ctGo('opening'); return; }
  if (st.phase === 'ready'){ st.queue = then || 'open'; ctTake(st); return; }
  if (st.phase === 'taking' || st.phase === 'opening'){ st.queue = then || st.queue || 'open'; return; }
  if (st.phase === 'opened' || st.phase === 'reading') return then === 'read' ? ctOpenModal() : ui.flash('Quẻ đã mở. Hãy đọc lời giải.');
  ui.flash(st.phase === 'idle' ? 'Chưa có quẻ. Hãy bắt đầu xin xăm.' : ctMsg.run);
}
function ctRead(st){
  if (st.phase === 'opened') return ctOpenModal();
  if (st.phase === 'held' || st.phase === 'ready' || st.phase === 'taking' || st.phase === 'opening') return ctOpen(st, 'read');
  if (st.phase === 'reading') return;
  ui.flash(st.phase === 'idle' ? 'Chưa có quẻ. Hãy bắt đầu xin xăm.' : ctMsg.run);

function ctAgain(st){

  if (st.phase === 'ready'){ ui.flash('Quẻ còn trong khay. Hãy lấy quẻ trước.'); return; }

/* ---------- the journey: which of the five steps the visitor is on, what to do, and which button and part to light ---------- */

    case 'coin': return { i:2, line:'Đồng xu đang vào khe...', part:'slot' };

.lgd{grid-template-columns:1fr 1fr;gap:2px 8px;margin:4px 0 12px;font:700 10.5px/1.25 ui-monospace,Menlo,monospace;letter-spacing:.03em;color:#231e16}
.lgd button{all:unset;display:flex;align-items:center;gap:6px;cursor:pointer;padding:4px;border-radius:7px;-webkit-tap-highlight-color:transparent}
.lgd b{flex:none;min-width:17px;height:17px;padding:0 3px;box-sizing:border-box;border-radius:999px;border:1.2px solid #231e16;background:#fff4d6;text-align:center;font:800 10px/15px ui-monospace,Menlo,monospace}
.lgd .on b{background:var(--accent,#f4b829)}.lgd .sel{background:rgba(35,30,22,.09)}.lgd .sel b{background:#231e16;color:#fff4d6}</style>
<script>(() => { const fig = document.getElementById("fig"); if (!fig) return;
  const lg = document.createElement("div"); lg.className = "lgd"; const at = document.querySelector(".zwrap") || fig; at.parentNode.insertBefore(lg, at.nextSibling);
  const hs = document.createElement("style"); document.head.appendChild(hs);
  let sig = "", sel = 0, q = 0, names = "", num = new Map();
  // the figure's own numbers count every label it has ever drawn; here they are reset to 1, 2, 3... down the left
  // column then the right, each time the set of labels changes (so they hold still while the figure turns)
  const renum = () => { if (innerWidth > 560) return; const gs = [...fig.querySelectorAll(".tag[data-t]")];
    const key = gs.map(g => g.dataset.t).sort().join("|");
    if (key !== names){ names = key; num = new Map(); const vb = fig.viewBox.baseVal, cx = vb.x + vb.width/2;
      const at = g => { const r = g.querySelector("rect"); return r ? [+r.getAttribute("x") + r.getAttribute("width")/2, +r.getAttribute("y")] : [0, 0]; };
      gs.map(g => [g.dataset.t, ...at(g)]).sort((a, b) => ((a[1] > cx) - (b[1] > cx)) || a[2] - b[2]).forEach(([t]) => { if (!num.has(t)) num.set(t, num.size + 1); }); }
    for (const g of gs){ const n = String(num.get(g.dataset.t)); if (g.dataset.n !== n){ g.dataset.n = n; const t = g.querySelector("text"); if (t) t.textContent = n; } } };
  const mark = () => { hs.textContent = sel ? `#fig .tag[data-n="${sel}"] rect{fill:#231e16!important}#fig .tag[data-n="${sel}"] text{fill:#fff4d6}#fig .tag[data-n="${sel}"] path{stroke-width:2.4}` : "";
    for (const x of lg.children) x.classList.toggle("sel", +x.dataset.n === sel); };
  const upd = () => { q = 0; const m = new Map();
    if (innerWidth <= 560) for (const g of fig.querySelectorAll(".tag[data-n]")){ const n = +g.dataset.n; if (!m.has(n)) m.set(n, [g.dataset.t, g.classList.contains("on")]); }
    const a = [...m].sort((x, y) => x[0] - y[0]), s = JSON.stringify(a); if (s === sig) return; sig = s;
    lg.classList.toggle("has", a.length > 0);
    lg.innerHTML = a.map(([n, [t, on]]) => `<button data-n="${n}" class="${on ? "on" : ""}"><b>${n}</b><span>${t}</span></button>`).join(""); mark(); };
  lg.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; sel = sel === +b.dataset.n ? 0 : +b.dataset.n; mark(); });
  new MutationObserver(() => { renum(); if (!q) q = requestAnimationFrame(upd); }).observe(fig, { childList: true, subtree: true }); renum();
  addEventListener("resize", () => { if (!q) q = requestAnimationFrame(upd); }); upd(); })();</script></body></html>
