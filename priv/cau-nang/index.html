<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* Free orthographic camera (internal names start with CAM_ / cam so they never clash with a figure's own names). YAW turns the viewer around the vertical axis (45° = the classic front-left view),
   PITCH is how far it looks down (35.26° = true isometric). At the defaults P() is exactly the old isometric
   projection, so every figure drawn for it still lines up. Drag the figure to orbit; double-click to reset.
   rotV(n) maps a world direction into the default view's frame, so vis / tone / any "sum of rotV > 0" test keep
   working at every angle: the viewer is always (1,1,1) and the light stays put relative to the viewer. */
let VIEW = 0, RC = [0, 0], RCZ = 0;
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];
const YAW0 = 45, PITCH0 = Math.atan(1/Math.SQRT2) * 180/Math.PI, CAM_K = Math.sqrt(1.5);
let YAW = YAW0, PITCH = PITCH0, CAM_R, CAM_U, CAM_V, CAM_D;                       // right, up, toward viewer, screen-down
const camBasis = (yaw, pitch) => { const t = yaw*Math.PI/180, p = pitch*Math.PI/180, ct = Math.cos(t), st = Math.sin(t), cp = Math.cos(p), sp2 = Math.sin(p);
  return { R:[st,-ct,0], U:[-sp2*ct,-sp2*st,cp], V:[cp*ct,cp*st,sp2] }; };
const CAM_B0 = camBasis(YAW0, PITCH0);
// CAM_LIM: how far (deg) the camera may turn either side of the front view; null = all the way round (set per figure)
let CAM_LIM = null;
function setCam(yaw, pitch){ YAW = CAM_LIM == null ? yaw : Math.max(YAW0 - CAM_LIM, Math.min(YAW0 + CAM_LIM, yaw));
  PITCH = CAM_LIM == null ? Math.max(6, Math.min(78, pitch)) : Math.max(15, Math.min(62, pitch)); const b = camBasis(YAW, PITCH); CAM_R = b.R; CAM_U = b.U; CAM_V = b.V; CAM_D = CAM_U.map(v => -v); }
setCam(YAW0, PITCH0);
const camDot = (a,b) => a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const rotV = n => { const r = camDot(n,CAM_R), u = camDot(n,CAM_U), v = camDot(n,CAM_V); return [0,1,2].map(i => CAM_B0.R[i]*r + CAM_B0.U[i]*u + CAM_B0.V[i]*v); };
// the light's ground direction turns with the viewer's yaw only (shadows always fall toward the lower left of the screen)
const yawTurn = ([x,y]) => { const t = (YAW - YAW0)*Math.PI/180, c = Math.cos(t), s = Math.sin(t); return [x*c - y*s, x*s + y*c]; };
const rotXY = (x,y) => [x, y];                                                // kept for old callers
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso
const P  = (x,y,z) => { const q = [x-RC[0], y-RC[1], z-RCZ];
  return [CAM_K*camDot(q,CAM_R) + (RC[0]-RC[1])*C + OX, CAM_K*camDot(q,CAM_D) + (RC[0]+RC[1])*S - RCZ + OY]; };
const Dv = (x,y,z) => [CAM_K*camDot([x,y,z],CAM_R), CAM_K*camDot([x,y,z],CAM_D)];
// distance toward the viewer: draw parts with smaller depth first
const depthOf = p => camDot(p, CAM_V);
// sort [{at:[x,y,z], svg}] back-to-front for the current camera. A part may also give box:[[x0,y0,z0],[x1,y1,z1]]:
// when two boxes are separated along x, y or z, the one on the viewer's side goes last (a centre point alone gets long
// or wrapping parts wrong: a pole beside a row of keys, a spout reaching past a cup).
const boxMid = b => [0,1,2].map(k => (b[0][k] + b[1][k]) / 2);
const sepOrder = (p, q) => { if (!p.box || !q.box) return 0;
  for (let k = 0; k < 3; k++){ if (p.box[1][k] <= q.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? -1 : 1; if (q.box[1][k] <= p.box[0][k] + 1e-6) return CAM_V[k] >= 0 ? 1 : -1; }
  return 0; };
const byDepth = parts => parts.filter(Boolean).sort((p,q) => sepOrder(p,q) || (depthOf(p.at || boxMid(p.box)) - depthOf(q.at || boxMid(q.box)))).map(p => p.svg).join('');
// the half of a vertical ring that faces the viewer / is turned away, as [from, to] angles in degrees (0 = +x, 90 = +y)
const nearHalf = () => [YAW - 90, YAW + 90], farHalf = () => [YAW + 90, YAW + 270];
// an open container (cup, bin, cone, drum) between two rings: far inner wall, then its contents, then the near outer wall
const openShell = (A, B, colour, contents = '') => loft(A, B, colour, true) + contents + loft(A, B, colour);
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
// Three flat tones, but blended across a narrow band at each step, so a face that turns past a threshold while the
// figure rotates fades between tones instead of snapping (at rest almost every face still sits on a pure tone).
const SOFT = .18;
const step3 = (d, hi, lo, m) => { const ss = (a, b, x) => { const k = Math.min(1, Math.max(0, (x - a)/(b - a))); return k*k*(3 - 2*k); };
  const a = ss(hi - SOFT, hi + SOFT, d), b = ss(lo - SOFT, lo + SOFT, d);
  return a >= 1 ? m.l : b <= 0 ? m.d : a > 0 ? mix(m.m, m.l, a) : b < 1 ? mix(m.d, m.m, b) : m.m; };
const tone  = (n,m) => step3(dot(rotV(n),L),   -.15, -.45, m);   // exterior, follows the sun
const toneI = (n,m) => step3(dot(rotV(n),LIN),  .6,   .05, m);   // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],

    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],

  // big numbers in the top-right corner (credit, change, score…); a value that changes gets a little bump
  const statsEl = document.getElementById('stats'), prevStats = {};
  ui.drawStats = () => { if (!statsEl) return;
    const list = cfg.stats(st).filter(Boolean), html = list.map(x => `<div class="stat${x.small ? ' small' : ''}"><div class="k">${x.label}</div><div class="v" data-k="${x.label}">${x.value}</div></div>`).join('');
    if (statsEl._html !== html){ statsEl._html = html; statsEl.innerHTML = html;
      statsEl.querySelectorAll('.v').forEach(v => { if (prevStats[v.dataset.k] != null && prevStats[v.dataset.k] !== v.textContent) v.classList.add('bump'); prevStats[v.dataset.k] = v.textContent; }); } };

    toast.style.top = ((document.getElementById('btns') ? document.getElementById('btns').offsetTop + document.getElementById('btns').offsetHeight : 0) + 8) + 'px'; toast.classList.add('show');
    clearTimeout(flashT); flashT = setTimeout(() => { ui._flash = false; toast.classList.remove('show'); ui.render(); }, ms); };

  document.getElementById('vreset').onclick = () => { spin = false; vsp.setAttribute('aria-pressed', false); camTo(YAW0, PITCH0); };
  const vsp = document.getElementById('vspin');
  vsp.onclick = () => { spin = !spin; vsp.setAttribute('aria-pressed', spin); camAnim++;
    let dir = 1;   // with a turning limit, the turntable swings back and forth inside it
    if (spin) ui.animate(dt => { if (!spin) return false; if (!drag){ let y = YAW + dir*dt*18;

  if (q.has('yaw') || q.has('pitch')) setCam(+(q.get('yaw') ?? YAW0), +(q.get('pitch') ?? PITCH0));
  const btns = document.getElementById('btns');
  const stepEls = [];
  if (btns) cfg.buttons.forEach((b, i) => {
    const wrap = document.createElement('div'); wrap.className = 'stepwrap';
    const el = document.createElement('button'); el.className = 'act';

      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;

  document.addEventListener('click', closeChips);

  document.getElementById('wb').oninput = e => document.getElementById('wob').setAttribute('scale', (e.target.value * INK_K).toFixed(2));
  const pals = document.getElementById('pals');

  lbl.onclick = () => setLabels(document.documentElement.classList.contains('nolabels'));

/* ---------- see-through + labels kit (shared; the figure supplies its own working parts) ----------

     items: [{ at:[x,y,z], text, on }], B: the object's bounds [x0, x1, y0, y1, z0, z1].
   xrGhost(body, mech, k, OUTp, x0, x1, m): far walls faintly, the working parts, then the case as a ghost over them.
   xrMount(getUI, caption): the See-through / Labels switches (top right), the caption under the figure, label hiding. */
function xrCallouts(items, B){
  const pts = []; for (const x of [B[0], B[1]]) for (const y of [B[2], B[3]]) for (const z of [B[4], B[5]]) pts.push(P(x, y, z));
  const xmin = Math.min(...pts.map(p => p[0])), xmax = Math.max(...pts.map(p => p[0])), cx = (xmin + xmax)/2;
  // on a phone (LBL_U = drawing units per screen px) each label is a numbered badge and the names go in a legend under the figure
  const k = INK_K, u = window.LBL_U ? LBL_U() : 0, fs = u ? 10*u : 8.6*k, hgt = u ? 17*u : fs*1.8, gap = hgt + (u ? 3*u : 3*k);
  const L = [], R = [];

  const roomL = xmin - vb.x >= wMax, roomR = vb.x + vb.width - xmax >= wMax;
  for (const it of items){ const [X, Y] = P(...it.at); ((X < cx && roomL) || !roomR ? L : R).push({ ...it, X, Y }); }
  let s = '';
  let top = { [-1]: fs, [1]: fs + 30*k };
  if (btn && svgEl.getScreenCTM()){ const r = btn.getBoundingClientRect(), q = new DOMPoint(r.right, r.bottom + 50).matrixTransform(svgEl.getScreenCTM().inverse());
    if (q.y > 0) top[-1] = q.y + hgt; }
  for (const [col, side] of [[L, -1], [R, 1]]){
    col.sort((a, b) => a.Y - b.Y);
    let y = -1e9; for (const c of col){ c.py = Math.max(c.Y, y + gap, top[side]); y = c.py; }
    const shift = col.length ? Math.max(0, col.reduce((a, c) => a + c.py - c.Y, 0) / col.length) : 0;
    const room = col.length ? col[0].py - top[side] : 0; for (const c of col) c.py -= Math.min(shift, room);
    for (const c of col){
      c.n = ((window.__ln || (window.__ln = {}))[c.text] || (__ln[c.text] = Object.keys(__ln).length + 1)); const w = u ? hgt*(c.n > 9 ? 1.3 : 1) : c.text.length*fs*.62 + fs*1.5;
      let px = side < 0 ? xmin - 10*k - w/2 : xmax + 10*k + w/2; px = Math.max(vb.x + w/2 + 2*k, Math.min(vb.x + vb.width - w/2 - 2*k, px));
      const ex = px - side*w/2;
      s += `<g class="tag${c.on ? ' on' : ''}" data-n="${c.n}" data-t="${c.text}"><path d="M${f(c.X)} ${f(c.Y)}L${f(ex + side*-4*k)} ${f(c.py)}L${f(ex)} ${f(c.py)}" fill="none" stroke="${INK}" stroke-width="1"/>`
        + `<circle cx="${f(c.X)}" cy="${f(c.Y)}" r="${f(1.4*k)}" fill="${INK}"/>`
        + `<rect x="${f(px - w/2)}" y="${f(c.py - hgt/2)}" width="${f(w)}" height="${f(hgt)}" rx="${f(hgt/2)}" fill="${c.on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
        + `<text x="${f(px)}" y="${f(c.py + fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${u ? c.n : c.text}</text></g>`;
    }
  }
  return s;
}
function xrGhost(body, mech, k, OUTp, x0, x1, m){
  const fF = facing([1,0,0]), fB = facing([-1,0,0]);

    + (fF ? fill(pd(on(PX(x0), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + (fB ? fill(pd(on(PX(x1), OUTp)), mix(m.d, '#f2efe7', .5)) : '') + `</g>`;

function xrMount(getUI, caption, opt = {}){   // opt.labelsOnly: only the Labels switch (the insides are on show already)

  if (ui.st.xr == null){ ui.st.xr = 0; ui.st.xrT = 0; }
  if (q.get('xr') === '1') ui.st.xr = ui.st.xrT = 1;
  const old = document.getElementById('lblctl'); if (old) old.style.display = 'none';
  const vset = document.createElement('div'); vset.className = 'vset';
  vset.innerHTML = '<div class="vrow">' + (opt.labelsOnly ? '' : '<button class="act" id="xrb" aria-pressed="false">See-through</button>') + '<button class="act" id="lblb" aria-pressed="false">Labels</button></div>';
  document.querySelector('.stage').appendChild(vset);
  // pages with a stats panel in the top right: the switches go just under it
  const place = () => { const sp = document.getElementById('stats'); vset.style.top = sp ? (sp.offsetTop + sp.offsetHeight + 10) + 'px' : ''; };
  place(); new ResizeObserver(place).observe(document.getElementById('stats') || vset);

  css.textContent = '.vset{position:absolute;top:4px;right:0;z-index:2}.vrow{display:flex;gap:6px}.vset .act[aria-pressed=true]{background:var(--ink);color:var(--paper)}'
    + 'html.nolabels #fig .tag{display:none}.mcap{width:100%;max-width:760px;min-height:3em;margin:0 0 14px;font-size:12.5px;line-height:1.5;text-align:center;transition:opacity .3s}'
    + '@media (max-width:560px){.vset{position:static;margin:4px 0}}';
  document.head.appendChild(css);
  const r0 = ui.render; ui.render = () => { r0(); const st = getUI().st; cap.style.opacity = st.xr > .5 ? 1 : 0; cap.textContent = caption(st); };

// same, for a body lofted between two horizontal rings A (bottom) and B (top)
function xrGhostRings(body, mech, k, A, B, m){
  const far = `<g opacity="${f(.5*k)}">` + loft(A, B, n => mix(toneI(n.map(v => -v), m), '#f2efe7', .55), true) + fill(pd(A), mix(m.d, '#f2efe7', .5)) + `</g>`;
  return far + mech + `<g opacity="${f(1 - .8*k)}">${body}</g>` + `<g opacity="${f(.6*k)}">` + hullInk([...A, ...B], 2.8) + `</g>`;

// generic see-through for any figure: the whole drawing fades back and the inside parts show over it.
//   opts: { mech(st, k) -> svg, inside(st) -> label items, surface(st) -> label items (optional), B: bounds, getSt() }
// washer-style ghost for an object without a single box case: its inside parts first, then the object pale over them
const xrUnder = (svg, mech, k) => `<g opacity="${f(k)}">${mech}</g><g opacity="${f(1 - .62*k)}">${svg}</g>`;
function xrWrap(sceneFn, opts){
  return function(){

    if (k > 0 && opts.under) s = xrUnder(s, opts.mech(st, k), k);   // the whole drawing is the object
    else if (k > 0 && !opts.inline) s = `<g opacity="${f(1 - .5*k)}">${s}</g><g opacity="${f(k)}">${opts.mech(st, k)}</g>`;   // inline: the figure ghosts its own case

    b.style.gridColumn = k.at[0] + 1; b.style.gridRow = k.at[1] + 1; dp.appendChild(b); els[k.key] = b; }
  if (spec.hub){ const h = document.createElement('div'); h.className = 'hub'; h.innerHTML = '<i></i>'; h.style.gridColumn = spec.hub[0] + 1; h.style.gridRow = spec.hub[1] + 1; dp.appendChild(h); }
  const go = document.createElement('button'); go.className = 'go'; go.innerHTML = `${spec.action}<small>SPACE</small>`; go.setAttribute('aria-label', spec.action);
  els[' '] = go;
  pad.append(dp, go); host.appendChild(pad);
  const send = (type, key) => dispatchEvent(new KeyboardEvent(type, { key, bubbles: true }));
  for (const [key, el] of Object.entries(els)){
    let held = null;
    el.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); if (held != null) return; held = e.pointerId;
      try { el.setPointerCapture(e.pointerId); } catch (_) {} send('keydown', key); });
    const release = e => { if (held == null || (e && e.pointerId !== held)) return; held = null; send('keyup', key); };
    el.addEventListener('pointerup', release); el.addEventListener('pointercancel', release); el.addEventListener('lostpointercapture', release);
    el.addEventListener('click', e => e.preventDefault());
    el.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); send('keydown', key); setTimeout(() => send('keyup', key), 120); } });
  }
  // space belongs to the game: a button that still has the focus from a click must not be pressed by it too
  addEventListener('keydown', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  addEventListener('keyup', e => { if (e.key === ' ' && e.target && e.target.closest && e.target.closest('button')) e.preventDefault(); }, true);
  // light the keys for real key presses too (and for the pad's own, which arrive the same way)
  addEventListener('keydown', e => { const el = els[e.key]; if (el) el.classList.add('down'); });
  addEventListener('keyup', e => { const el = els[e.key]; if (el) el.classList.remove('down'); });
  addEventListener('blur', () => Object.values(els).forEach(el => el.classList.remove('down')));
}

</script>
<script>
/* =====================================================================================================
   Miếu cầu nắng: a small roadside shrine where you pray for sunshine. A sibling of the Chùa Tàu machine.

   TRUTH FIRST (a typical Vietnamese roadside miếu; the bell and the slip box are part of this game, not of every miếu):
   1. Light three incense sticks; they go in the bronze incense pot (bát nhang) on the front ledge.
   2. Pull the cord of the small bronze bell hanging from its wooden post beside the shrine.
   3. Pray before the shrine: the oil lamp inside is lit, the incense smoke rises.
   4. The clouds over the shrine drift apart and the sun comes out; the scene warms, shadows appear.
      Only clouds that clear: nothing falls from the sky.
   5. A slip rises out of the slot of the small red slip box on the ledge; take it and read it.
   Where things are after each step: sticks unlit → lit (smoke) · bell still → swinging → still ·
                                     lamp dark → lit · clouds over the sun → at the edges · slip in box → slot → hand.

   COORDINATES: x = depth (sky backdrop at x = 0..1, the scene in front of it), y = width (+y = viewer-left),
   z = up. 1 unit ≈ 1 cm. The shrine is centred on y = 90; the bell post stands viewer-left at y = 140.

   PARTS LIST
   backdrop: sky panel (gradient), sun with halo and rays, eight clouds
   ground:   grass patch with earth front, dirt path, stones, grass tufts
   shrine:   plinth, plastered pillar with red band, capital slab with front ledge, yellow plaster body,
             two red front columns, arched opening, MIẾU plaque, eave board, hip roof with tile lines,
             ridge with upturned ends, corner tips, gold pearl
   inside:   back wall, floor, red ancestral tablet, oil lamp (base, glass, flame)
   ledge:    bronze incense pot with ash and 3 sticks, red slip box with slot and sun emblem, slip,
             plate with 3 oranges
   bell:     stone footing, wooden post and arm, hook, bronze bell with band, cord with tassel
   ===================================================================================================== */

const cnPLASTER = { l:'#fbe7a6', m:'#eccb72', d:'#a8823a' }, cnTILE = { l:'#e8573e', m:'#c43a24', d:'#6e1d10' };
const cnCREAM = { l:'#f6efdc', m:'#e2d6b6', d:'#a99a74' }, cnGOLD = { l:'#f7d774', m:'#d6a53a', d:'#8c6418' };
const cnBRONZE = { l:'#c99a5a', m:'#9a6c34', d:'#5a3c18' }, cnGRASS = { l:'#b9d27e', m:'#93b45c', d:'#5f7a35' };
const cnEARTH = { l:'#c99a68', m:'#a8794a', d:'#6e4a2a' }, cnPOST = { l:'#b98756', m:'#93633a', d:'#5c3b20' };
const cnSTONE = { l:'#d8d4ca', m:'#b5b0a4', d:'#7d786c' }, cnPAPER = { l:'#fffaf0', m:'#f1e6cc', d:'#cdbf9f' };
const cnSERIF = "'Noto Serif','Times New Roman',Georgia,serif";
const cnSUNY = 50, cnPIV = [41.5, 126, 157];
const cnRM = (() => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } })();

/* ---------- small helpers ---------- */
const cnLerp = (a, b, t) => a.map((v, i) => v + (b[i] - v)*t);
const cnCl = v => Math.max(0, Math.min(1, v));
const cnRX = (x, y0, z0, y1, z1) => on(PX(x), rectUV(y0, z0, y1, z1));
const cnText = (o, U, V, str, size, col, fam, weight) => `<text transform="${txM(P(...o), U, V)}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="${fam}" font-weight="${weight}">${str}</text>`;
const cnTxX = (x,y,z,str,size,col=INK,weight=700,fam=cnSERIF) => cnText([x,y,z], Dv(0,-1,0), Dv(0,0,-1), str, size, col, fam, weight);
const cnStroke = (pts, col, w, close = true, extra = '') => `<path d="${pd(pts, close)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round" ${extra}/>`;
const cnDot = (p, r, col, extra = '') => { const [X, Y] = P(...p); return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(CAM_K*r)}" fill="${col}" ${extra}/>`; };
const cnBall = (c, r, m, w = .9) => { const [X, Y] = P(...c), R = CAM_K*r;
  return `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="${m.m}"/><circle cx="${f(X - R*.28)}" cy="${f(Y - R*.3)}" r="${f(R*.55)}" fill="${m.l}"/><circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="none" stroke="${INK}" stroke-width="${w}"/>`; };
// overcast greys every colour a little; k = 1 (sun out) gives the true colours back
const cnDull = (m, k) => k >= 1 ? m : Object.fromEntries(['l', 'm', 'd'].map(t => [t, mix(mix(m[t], '#a2a9b0', .34), m[t], k)]));
const cnEsc = s => String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' })[ch]);

/* ---------- the journey's look: every drawn quantity comes from (phase, t) ---------- */
const cnOrder = ['idle', 'lighting', 'lit', 'ringing', 'rung', 'praying', 'prayed', 'clearing', 'rise', 'ready', 'taking', 'held', 'reading', 'done', 'fade'];
const cnDurs = { lighting: [1.6, .8], ringing: [2.6, 1.2], praying: [2.4, 1.0], clearing: [3.6, 1.6], rise: [1.2, .6], taking: [.9, .4], fade: [1.6, .7] };
const cnDur = ph => (cnDurs[ph] || [0, 0])[cnRM ? 1 : 0];
function cnLook(st){
  const i = cnOrder.indexOf(st.phase), past = p => i > cnOrder.indexOf(p), T = cnDur(st.phase), u = T ? cnCl(st.t/T) : 1;
  const now = p => st.phase === p;
  const lk = {
    inc:   now('lighting') ? u : past('lighting') ? 1 : 0,
    bell:  now('ringing') ? 20*Math.sin(u*Math.PI*5)*Math.pow(1 - u, 1.3) : 0,
    wave:  now('ringing') ? u : -1,
    lamp:  now('praying') ? ease(cnCl(u*1.6)) : past('praying') ? 1 : 0,
    sun:   now('clearing') ? ease(u) : past('clearing') ? 1 : 0,
    slip:  now('rise') ? ease(u) : past('rise') ? 1 : 0,
    card:  now('taking') ? ease(u) : past('taking') ? 1 : 0,
    alpha: 1,
  };
  if (now('fade')){ const k = 1 - ease(u); lk.inc = lk.lamp = lk.sun = k; lk.alpha = k; lk.slip = 0; }
  return lk;
}

/* ---------- backdrop: the sky panel, the sun and the clouds ---------- */
const cnClouds = [
  { y:150, z:200, s:1.15, dy: 42 }, { y:112, z:212, s:1.3, dy: 52 }, { y:70, z:202, s:1.4, dy:-66 }, { y:34, z:214, s:1.15, dy:-46 },
  { y:50, z:182, s:1.15, dy:-58 }, { y:100, z:180, s:1.0, dy: 58 }, { y:18, z:172, s:.9, dy:-36 }, { y:160, z:172, s:.9, dy: 30 },
];
function cnCloud(y, z, s, col, shd){
  const blobs = [[-15, 0, 8], [-5, 6, 11.5], [7, 4, 10], [16, -1, 7.5]].map(([dy, dz, r]) => { const [X, Y] = P(1.5, y + dy*s, z + dz*s); return [X, Y, CAM_K*r*s]; });
  const base = pd(on(PX(1.5), rrUV(y - 21*s, z - 7*s, y + 22*s, z + 1*s, 3*s)));
  const circ = ([X, Y, R], c, extra = '') => `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="${c}" ${extra}/>`;
  return blobs.map(b => circ(b, INK, `stroke="${INK}" stroke-width="2.2"`)).join('') + `<path d="${base}" fill="${INK}" stroke="${INK}" stroke-width="2.2"/>`
    + blobs.map(b => circ(b, shd)).join('') + fill(base, shd)
    + blobs.map(([X, Y, R]) => circ([X, Y - R*.2, R*.8], col)).join('');
}
function cnSky(lk){
  const k = lk.sun, panel = on(PX(1), rrUV(0, 0, 180, 235, 10));
  const top = mix('#aab7c4', '#79bfe9', k), bot = mix('#d2d7dc', '#ffe2a0', k);
  const [gx1, gy1] = P(1, 90, 235), [gx2, gy2] = P(1, 90, 0);
  let s = `<defs><linearGradient id="cnsky" gradientUnits="userSpaceOnUse" x1="${f(gx1)}" y1="${f(gy1)}" x2="${f(gx2)}" y2="${f(gy2)}"><stop offset="0" stop-color="${top}"/><stop offset="1" stop-color="${bot}"/></linearGradient></defs>`;
  s += fill(pd(panel), 'url(#cnsky)');
  let inner = '';
  if (k > 0){
    const z = 172 + 26*k, c = [1.2, cnSUNY, z], [X, Y] = P(...c), R = CAM_K*13, a = cnCl(k*2.2);
    inner += `<g opacity="${f(a)}">` + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R*2.3)}" fill="#fff4c2" opacity="${f(.55*k)}"/>`;
    for (let i = 0; i < 12; i++){ const t = i/12*2*Math.PI + .13, r0 = R*(1.22), r1 = R*(1.22 + .38*k);
      const d = `M${f(X + r0*Math.cos(t))} ${f(Y + r0*Math.sin(t))}L${f(X + r1*Math.cos(t))} ${f(Y + r1*Math.sin(t))}`;
      inner += `<path d="${d}" stroke="${INK}" stroke-width="2.6" stroke-linecap="round"/><path d="${d}" stroke="#f3a51f" stroke-width="1.4" stroke-linecap="round"/>`; }
    inner += `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="#ffcf3a"/><circle cx="${f(X - R*.18)}" cy="${f(Y - R*.2)}" r="${f(R*.66)}" fill="#ffe681"/>`
      + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(R)}" fill="none" stroke="${INK}" stroke-width="1.5"/></g>`;
  }
  const col = mix('#c6ccd4', '#fffdf6', k), shd = mix('#a4aeba', '#e4ebf1', k);
  for (const c of cnClouds) inner += cnCloud(c.y + c.dy*k, c.z + 6*k, c.s*(1 - .18*k), col, shd);
  return s + clipTo(panel, inner) + ink(pd(panel), 2);
}
const cnSkyBack = () => shape(on(PX(0), rrUV(0, 0, 180, 235, 10)), cnPOST.d, 2);

/* ---------- ground ---------- */
function cnGround(k){
  const G = cnDull(cnGRASS, k), E = cnDull(cnEARTH, k);
  let s = box(0, 0, 0, 84, 180, 3, E, toneI, 1.6);
  if (vis([0,0,1])){ s += shape(on(PZ(3), rectUV(0, 0, 84, 180)), G.m, 1.4)
      + fill(pd(on(PZ(3.02), [[56, 80], [84, 76], [84, 104], [56, 100]])), mix('#e2cf9e', '#a2a9b0', .3*(1 - k)));
    for (const [x, y] of [[70, 30], [78, 58], [66, 132], [80, 160], [74, 118], [62, 20]]){ const [X, Y] = P(x, y, 3);
      s += `<path d="M${f(X - 2)} ${f(Y)}l1 -3M${f(X)} ${f(Y)}l0 -4M${f(X + 2)} ${f(Y)}l-1 -3" stroke="${G.d}" stroke-width="1" stroke-linecap="round" fill="none"/>`; } }
  return s;
}
const cnStones = k => { const m = cnDull(cnSTONE, k); return [[76, 66, 2.2], [79, 112, 1.6], [70, 150, 1.9]].map(([x, y, r]) =>
  ({ box:[[x - r, y - r, 3], [x + r, y + r, 3 + r]], svg: rod([x, y, 3], [x, y, 3 + r*.9], r, m, toneI, .8, r*.7, 12) })); };

/* ---------- the shrine (pillar + slab, body with its opening, roof) ---------- */
const cnArch = x => { const pts = [[x, 80, 101], [x, 100, 101], [x, 100, 116]];
  for (let i = 1; i < 14; i++){ const a = i/14*Math.PI; pts.push([x, 90 + 10*Math.cos(a), 116 + 10*Math.sin(a)]); }
  pts.push([x, 80, 116]); return pts; };
function cnPillar(k){
  const CR = cnDull(cnCREAM, k), TL = cnDull(cnTILE, k);
  let s = box(26, 74, 3, 58, 106, 9, CR, tone, 1.4) + box(30, 78, 9, 54, 102, 92, CR, tone, 1.6);
  if (vis([1,0,0])) s += box(54, 78, 80, 54.4, 102, 84, TL, tone, .8) + cnStroke(cnRX(54.45, 82, 20, 98, 70), CR.d, .7);
  s += box(24, 68, 92, 64, 112, 98, CR, tone, 1.5);
  return { box:[[24, 68, 3], [64, 112, 98]], svg: s };
}
function cnInterior(lk){
  const x1 = 57, lamp = lk.lamp;
  let s = fill(pd(cnRX(30.5, 71, 98, 109, 136)), mix('#5c1a10', '#8a2a14', lamp*.6));
  if (vis([0,0,1])) s += fill(pd(on(PZ(98.05), rectUV(30.5, 72, x1, 108))), '#3f120b');
  // ancestral tablet: red board with a gold frame, on a small stand
  s += box(31, 84, 98, 33, 96, 101, cnGOLD, toneI, .6) + box(31, 85.5, 101, 32.6, 94.5, 117, cnTILE, toneI, .8);
  if (vis([1,0,0])) s += cnStroke(cnRX(32.65, 86.5, 102.5, 93.5, 115.5), cnGOLD.m, .7) + cnStroke([[32.66, 90, 113], [32.66, 90, 105]], cnGOLD.l, .9, false);
  // oil lamp: base, glass belly, wick and flame
  const lx = 44, ly = 90;
  s += cyl(lx, ly, 98, 99.4, 1.9, cnBRONZE, toneI, .8, 16);
  s += `<g opacity=".85">${loft(on(PZ(99.4), ellUV(lx, ly, 1.2, 1.2, 16)), on(PZ(101.8), ellUV(lx, ly, 2.1, 2.1, 16)), n => toneI(n, CLEAR))}${loft(on(PZ(101.8), ellUV(lx, ly, 2.1, 2.1, 16)), on(PZ(104), ellUV(lx, ly, .8, .8, 16)), n => toneI(n, CLEAR))}</g>`
    + hullInk([...on(PZ(99.4), ellUV(lx, ly, 1.2, 1.2, 16)), ...on(PZ(101.8), ellUV(lx, ly, 2.1, 2.1, 16)), ...on(PZ(104), ellUV(lx, ly, .8, .8, 16))], .8);
  if (lamp > 0){ const [X, Y] = P(lx, ly, 104.2), h = CAM_K*3.6*lamp, w = CAM_K*1.1*lamp;
    s += cnDot([lx, ly, 106], 9*lamp, '#ffd36a', `opacity="${f(.35*lamp)}"`)
      + `<path d="M${f(X)} ${f(Y)}c${f(-w)} ${f(-h*.3)} ${f(-w*.6)} ${f(-h*.75)} 0 ${f(-h)}c${f(w*.6)} ${f(h*.25)} ${f(w)} ${f(h*.7)} 0 ${f(h)}Z" fill="#ffb020" stroke="${INK}" stroke-width=".6"/>`; }
  if (lamp > 0) s += fill(pd(cnArch(x1)), '#ffcf6a', `opacity="${f(.18*lamp)}"`);
  return clipTo(cnArch(x1 + .02), s);
}
function cnBody(lk, k){
  const PL = cnDull(cnPLASTER, k), TL = cnDull(cnTILE, k), FRONT = vis([1,0,0]);
  let s = box(28, 71, 98, 57, 109, 136, PL, tone, 2.2);
  if (FRONT){
    s += cnInterior(lk) + cnStroke(cnArch(57.05), TL.m, 2.6) + ink(pd(cnArch(57.05)), 1.6);
    for (const [y0, y1] of [[72, 75.5], [104.5, 108]]) s += box(57, y0, 98, 57.8, y1, 136, TL, tone, .9);
    s += box(57, 83, 127.6, 57.5, 97, 134, TL, tone, .9) + cnStroke(cnRX(57.55, 84, 128.4, 96, 133.2), cnGOLD.l, .6)
      + cnTxX(57.56, 90, 129.6, 'MIẾU', 3.4, cnGOLD.l, 800);
  }
  return { box:[[28, 71, 98], [57.8, 109, 136]], svg: s };
}
function cnRoof(k){
  const TL = cnDull(cnTILE, k), GD = cnDull(cnGOLD, k);
  let s = box(21, 63, 135, 67, 117, 137, TL, tone, 1.2);
  const rA = on(PZ(137), rectUV(22, 64, 66, 116)), rB = on(PZ(150), rectUV(38, 80, 50, 100));
  s += loft(rA, rB, n => tone(n, TL)) + fill(pd(rB), tone([0,0,1], TL));
  const cen = avg(rA.concat(rB));
  for (let i = 0; i < 4; i++){ const a0 = rA[i], a1 = rA[(i + 1) % 4], b0 = rB[i], b1 = rB[(i + 1) % 4];
    let nr = norm(cross(sub(a1, a0), sub(b0, a0))); if (dot(nr, sub(avg([a0, a1, b1, b0]), cen)) < 0) nr = nr.map(v => -v);
    if (!vis(nr)) continue;
    for (let j = 1; j < 12; j++){ const t = j/12; s += cnStroke([cnLerp(a0, a1, t), cnLerp(b0, b1, t)], TL.d, .55, false); } }
  s += hullInk([...rA, ...rB], 2.4);
  const tips = rA.map(p => { const o = [p[0] < 44 ? -2.5 : 2.5, p[1] < 90 ? -3 : 3, 4], q = [p[0] + o[0], p[1] + o[1], p[2] + o[2]];
    return { box:[[Math.min(p[0], q[0]) - .8, Math.min(p[1], q[1]) - .8, p[2]], [Math.max(p[0], q[0]) + .8, Math.max(p[1], q[1]) + .8, q[2] + .8]], svg: rod(p, q, 1, TL, tone, .8, .4, 10) }; });
  s += byDepth([
    { box:[[41, 78, 150], [47, 102, 153]], svg: box(41, 78, 150, 47, 102, 153, TL, tone, 1) },
    { box:[[41, 78, 153], [47, 80.5, 157]], svg: box(41, 78, 153, 47, 80.5, 157, TL, tone, .9) },
    { box:[[41, 99.5, 153], [47, 102, 157]], svg: box(41, 99.5, 153, 47, 102, 157, TL, tone, .9) },
    ...tips,
    { box:[[41.8, 87.8, 153], [46.2, 92.2, 158]], svg: cnBall([44, 90, 155.4], 2.2, GD, 1) },
  ]);
  return { box:[[19, 60, 135], [69, 120, 158]], svg: s };
}

/* ---------- ledge: incense pot, slip box with the slip, plate of oranges ---------- */
const cnPot = [60.6, 90], cnSticks = [-1.3, 0, 1.3];
const cnTip = dy => [cnPot[0], cnPot[1] + dy*1.8, 117];
function cnIncense(lk, k){
  const [x, y] = cnPot, B = cnDull(cnBRONZE, k);
  let s = cyl(x, y, 98, 99, 2.4, B, toneI, .8, 18) + cyl(x, y, 99, 103.4, 3.2, B, toneI, 1.1, 20)
    + fill(pd(on(PZ(103.42), ellUV(x, y, 2.6, 2.6, 18))), '#9c9285');
  if (vis([1,0,0])) s += cnStroke([[x + 3.25, y + 1.4, 101.6], [x + 3.25, y - 1.4, 101.6]], cnGOLD.l, .8, false);
  cnSticks.forEach((dy, j) => { const tip = cnTip(dy), on1 = lk.inc > j/3 + .12;
    s += rod([x, y + dy*.5, 103.4], tip, .22, { l:'#c0573a', m:'#9a3d24', d:'#6a2614' }, toneI, .5, .22, 6);
    if (on1) s += cnDot(tip, 1.6, '#ffb060', 'opacity=".45"') + cnDot(tip, .6, '#ff6a1a'); });
  return { box:[[x - 3.3, y - 3.3, 98], [x + 3.3, y + 3.3, 118]], svg: act('incense', s) };
}
function cnSlipBox(lk, k){
  const TL = cnDull(cnTILE, k);
  let s = box(58.5, 100, 98, 63.5, 107, 104, TL, tone, 1.1);
  if (vis([0,0,1])) s += shape(on(PZ(104.03), rectUV(60.3, 101.4, 61.7, 105.6)), '#1d0b06', .5);
  if (vis([1,0,0])) s += cnDot([63.55, 103.5, 101], 1.25, cnGOLD.l, `stroke="${INK}" stroke-width=".5"`);
  const h = 9*lk.slip;
  if (h > .2){ const xs = 61;
    s += shape(cnRX(xs, 101.8, 104, 105.2, 104 + h), vis([1,0,0]) ? '#fdf6df' : '#efe2c2', .8);
    if (h > 4 && vis([1,0,0])) s += cnStroke(cnRX(xs + .02, 102.2, 104 + h - 3.6, 104.8, 104 + h - .4), '#d9791f', .5) + cnDot([xs + .04, 103.5, 104 + h - 2], .7, '#f3a51f'); }
  return { box:[[58.5, 100, 98], [63.5, 107, 113.2]], svg: act('box', s) };
}
function cnPlate(k){
  const x = 60.8, y = 77, OR = cnDull({ l:'#ffb347', m:'#f28c1f', d:'#a5520c' }, k);
  let s = cyl(x, y, 98, 98.8, 3, cnDull(CERAMIC, k), toneI, .8, 20);
  s += cnBall([x, y + 1.25, 100.3], 1.5, OR, .8) + cnBall([x, y - 1.25, 100.3], 1.5, OR, .8) + cnBall([x, y, 102.4], 1.45, OR, .8);
  return { box:[[x - 3, y - 3, 98], [x + 3, y + 3, 104]], svg: s };
}

/* ---------- the bell on its post (swings about the x axis, so it swings sideways for the viewer) ---------- */
function cnPost(k){
  const W = cnDull(cnPOST, k);
  return [
    { box:[[37, 135, 3], [46, 145, 7]], svg: box(37, 135, 3, 46, 145, 7, cnDull(cnSTONE, k), tone, 1.1) },
    { box:[[40, 138.5, 7], [43, 141.5, 157]], svg: box(40, 138.5, 7, 43, 141.5, 157, W, tone, 1.3) },
    { box:[[40, 122, 157], [43, 141.5, 160]], svg: box(40, 122, 157, 43, 141.5, 160, W, tone, 1.2) },
  ];
}
const cnRot = (p, a) => { const c = Math.cos(a), s2 = Math.sin(a), dy = p[1] - cnPIV[1], dz = p[2] - cnPIV[2];
  return [p[0], cnPIV[1] + dy*c - dz*s2, cnPIV[2] + dy*s2 + dz*c]; };
function cnBell(lk, k){
  const a = lk.bell*Math.PI/180, [x, y] = cnPIV, B = cnDull(cnBRONZE, k);
  const ring = (z, r) => on(PZ(z), ellUV(x, y, r, r, 20)).map(p => cnRot(p, a));
  const prof = [[154.6, 1.5], [153.7, 2.8], [152, 3.4], [147.6, 4.1], [147, 4.15], [146, 4.7], [145.3, 4.9]].map(([z, r]) => ring(z, r));
  let s = '';
  // cord and tassel hang from the clapper, below the bell (drawn first: the bell hangs in front of its top end)
  const c0 = cnRot([x, y, 146], a), c1 = cnRot([x, y, 128], a*1.25), c2 = cnRot([x, y, 125], a*1.25);
  s += `<path d="${pd([c0, c1], false)}" stroke="${INK}" stroke-width="1.5" stroke-linecap="round" fill="none"/><path d="${pd([c0, c1], false)}" stroke="#c8321f" stroke-width=".8" stroke-linecap="round" fill="none"/>`
    + rod(c1, c2, .5, cnDull(cnTILE, k), toneI, .7, 1.1, 10);
  s += rod([x, y, 157], cnRot([x, y, 154.6], a), .35, METAL, toneI, .6, .35, 8);
  for (let i = 0; i < prof.length - 1; i++) s += loft(prof[i], prof[i + 1], n => toneI(n, i === 3 ? { l:B.m, m:B.d, d:B.d } : B));
  s += fill(pd(prof[0]), B.l) + hullInk(prof.flat(), 1.4);
  if (lk.wave >= 0){ const [X, Y] = P(...cnRot([x, y, 149], a)), u = lk.wave;
    for (let j = 0; j < 3; j++){ const v = (u*2.6 + j/3) % 1, R = CAM_K*(7 + 12*v), op = (1 - v)*(1 - u*.6);
      for (const [t0, t1] of [[-.6, .6], [Math.PI - .6, Math.PI + .6]]){
        const p0 = [X + R*Math.cos(t0), Y + R*Math.sin(t0)], p1 = [X + R*Math.cos(t1), Y + R*Math.sin(t1)];
        s += `<path d="M${f(p0[0])} ${f(p0[1])}A${f(R)} ${f(R)} 0 0 1 ${f(p1[0])} ${f(p1[1])}" fill="none" stroke="${INK}" stroke-width="1.1" stroke-linecap="round" opacity="${f(op)}"/>`; } } }
  return { box:[[36, 117, 123], [47, 135, 158]], svg: act('bell', s) };
}

/* ---------- the slip in the hand ---------- */
function cnCard(st, lk){
  const u = lk.card, x = 61 + 19*u;
  const y0 = 101.8 + (76 - 101.8)*u, y1 = 105.2 + (104 - 105.2)*u, z0 = 104 + (54 - 104)*u, z1 = 113 + (92 - 113)*u;
  const pts = cnRX(x, y0, z0, y1, z1), FRONT = vis([1,0,0]);
  let s = shape(pts, FRONT ? '#fdf6df' : '#efe2c2', 1.2);
  if (FRONT && u > .75){ const ym = (y0 + y1)/2, xf = x + .05;
    s += cnStroke(cnRX(xf, y0 + 1.2, z0 + 1.2, y1 - 1.2, z1 - 1.2), '#d9791f', .9)
      + cnTxX(xf, ym, z1 - 6.2, 'PHIẾU CẦU NẮNG', 2.4, '#c4561a', 800)
      + cnDot([xf, ym, z1 - 14], 3.2, '#ffcf3a', `stroke="${INK}" stroke-width=".7"`)
      + cnTxX(xf, ym, z0 + 10, 'Trời sẽ', 3.4, INK, 800)
      + cnTxX(xf, ym, z0 + 5, 'nắng thôi', 3.4, INK, 800);
    for (let i = 0; i < 8; i++){ const t = i/8*2*Math.PI, c = [xf, ym, z1 - 14];
      s += cnStroke([[xf, c[1] + 4*Math.cos(t), c[2] + 4*Math.sin(t)], [xf, c[1] + 5.4*Math.cos(t), c[2] + 5.4*Math.sin(t)]], '#f3a51f', .7, false); } }
  return { box:[[x - .3, Math.min(y0, y1), z0], [x + .3, Math.max(y0, y1), z1]], svg: act('card', lk.alpha < 1 ? `<g opacity="${f(lk.alpha)}">${s}</g>` : s) };
}

/* ================= sound: synthesized with WebAudio; nothing plays before a press ================= */
const cnSound = (() => {
  const NAMES = ['Tắt', 'Nhỏ', 'Vừa', 'Lớn'], GAINS = [0, .3, .55, .85];
  let level = 2, ctx = null, out = null, noiseBuf = null;
  try { const v = localStorage.getItem('chuatau.sound'); if (v != null && GAINS[+v] != null) level = +v; } catch {}
  function ac(){ if (!level || (navigator.userActivation && !navigator.userActivation.hasBeenActive)) return null;
    try { if (!ctx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
        ctx = new AC(); out = ctx.createGain(); out.connect(ctx.destination);
        noiseBuf = ctx.createBuffer(1, ctx.sampleRate*.5, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
      out.gain.value = GAINS[level]; if (ctx.state === 'suspended') ctx.resume(); return ctx; } catch { return null; } }
  const env = (g, t, a, peak, d) => { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(.0001, t + a + d); };
  function osc(fq, type, peak, a, d, when = 0){ const c = ac(); if (!c) return;
    const t = c.currentTime + when, o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(fq, t);
    env(g, t, a, peak, d); o.connect(g).connect(out); o.start(t); o.stop(t + a + d + .05); }
  function noise(fc, q, peak, d, when = 0){ const c = ac(); if (!c) return;
    const t = c.currentTime + when, s = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    s.buffer = noiseBuf; bp.type = 'bandpass'; bp.frequency.value = fc; bp.Q.value = q; env(g, t, .002, peak, d); s.connect(bp).connect(g).connect(out); s.start(t, Math.random()*.3); s.stop(t + d + .05); }
  const bell = (f0, peak = .22, d = 2.6, when = 0) => { for (const [r, k] of [[1, 1], [2.76, .45], [5.4, .22], [8.93, .1]]) osc(f0*r, 'sine', peak*k, .004, d/r**.5, when); };
  return {
    NAMES, get level(){ return level; },
    set(v){ level = v; try { localStorage.setItem('chuatau.sound', String(v)); } catch {} if (out && level) out.gain.value = GAINS[level]; },
    pick(){ noise(3200, 5, .12, .04); osc(1900, 'sine', .06, .001, .12); },
    strike(){ noise(2400, 1.4, .14, .22); noise(900, 1, .06, .4, .05); },
    bell(){ bell(294, .26, 3.4); bell(294, .16, 2.8, 1.05); },
    pray(){ bell(196, .12, 3.2); },
    clear(){ [523, 659, 784, 1047].forEach((fq, i) => osc(fq, 'sine', .07, .01, 1.2, .3 + i*.28)); },
    slip(){ noise(3000, 1.2, .07, .45); for (let i = 0; i < 6; i++) noise(5200, 2, .03, .03, .05 + i*.06); },
    take(){ noise(1100, 2, .12, .18); },
    close(){ noise(700, 3, .12, .1); },
  };
})();

/* ================= the ritual: one state object, one frame driver ================= */
const cnState = { phase:'idle', t:0, ev:{} };
let ui = null, cnLoop = false;
function cnGo(ph){ const st = ui.st; st.phase = ph; st.t = 0; st.ev = {}; cnRun(); }
function cnRun(){ if (cnLoop) return; cnLoop = true; ui.animate(cnTick); }
const cnAfter = { lighting:'lit', ringing:'rung', praying:'prayed', clearing:'rise', rise:'ready', taking:'held', fade:'idle' };
function cnTick(dt){
  const st = ui.st, T = cnDur(st.phase);
  if (!T){ cnLoop = false; return false; }
  st.t += dt;
  const ev = (name, cond, fn) => { if (cond && !st.ev[name]){ st.ev[name] = 1; fn(); } };
  if (st.phase === 'lighting') cnSticks.forEach((_, j) => ev('s' + j, st.t/T > j/3 + .12, () => cnSound.pick()));
  if (st.phase === 'clearing') ev('chime', st.t/T > .2, () => cnSound.clear());
  if (st.phase === 'rise') ev('slip', true, () => cnSound.slip());
  if (st.t < T) return true;
  const ph = st.phase;
  st.phase = cnAfter[ph]; st.t = 0; st.ev = {};
  if (ph === 'lighting') cnSmoke(true);
  if (ph === 'clearing') ui.flash('Mây đã tan, nắng đã lên.', 2000);
  if (ph === 'rise') ui.flash('Phiếu cầu nắng đã ra.', 2000);
  if (ph === 'fade') cnSmoke(false);
  ui.drawStats && ui.drawStats();
  if (cnDur(st.phase)) return true;
  cnLoop = false; return false;
}

/* each action needs one resting phase; out of order it says what to do first */
const cnActs = {
  light: { at:'idle',   run: st => { cnSound.strike(); cnGo('lighting'); } },
  ring:  { at:'lit',    run: st => { cnSound.bell(); cnGo('ringing'); } },
  pray:  { at:'rung',   run: st => { cnSound.pray(); cnBurst(); cnGo('praying'); } },
  clear: { at:'prayed', run: st => cnGo('clearing') },
  take:  { at:'ready',  run: st => { cnSound.take(); cnGo('taking'); } },
  read:  { at:'held',   run: st => cnOpenModal() },
  again: { at:'done',   run: st => { cnCloseModal(true); cnSound.close(); cnGo('fade'); } },
};
function cnTry(name){
  const st = ui.st, a = cnActs[name];
  if (st.phase === a.at) return a.run(st);
  if (name === 'read' && st.phase === 'done') return cnOpenModal();
  if (name === 'again' && st.phase === 'held') return cnActs.again.run(st);
  if (cnDur(st.phase)) return ui.flash('Chờ một chút...');
  if (st.phase === 'reading') return;
  if (cnOrder.indexOf(st.phase) < cnOrder.indexOf(a.at)) return ui.flash('Hãy ' + cnStep(st).go.toLowerCase() + ' trước.');
  ui.flash('Bước này đã xong.');
}
function cnNext(){ const st = ui.st; if (st.phase === 'reading') cnCloseModal(); else { const s = cnStep(st); if (s.act) cnTry(s.act); } ui.render(); }

/* ---------- the journey: which of the five steps the visitor is on, what to do, and which button and part to light ---------- */
const cnSteps = ['Thắp nhang', 'Rung chuông', 'Khấn nguyện', 'Mây tan, nắng lên', 'Nhận phiếu'];
const cnGlowAt = { incense:[60.6, 90, 110], bell:[41.5, 126, 150], altar:[57, 90, 112], sky:[1, cnSUNY, 186], box:[61, 103.5, 107], card:[80, 90, 73] };
function cnStep(st){
  switch (st.phase){
    case 'idle':     return { i:0, line:'Thắp ba nén nhang ở bát nhang trước miếu.', go:'Thắp nhang', btn:'Thắp nhang', part:'incense', act:'light' };
    case 'lighting': return { i:0, line:'Nhang đang bén lửa...' };
    case 'lit':      return { i:1, line:'Kéo dây, rung chuông một hồi.', go:'Rung chuông', btn:'Rung chuông', part:'bell', act:'ring' };
    case 'ringing':  return { i:1, line:'Chuông đang ngân...' };
    case 'rung':     return { i:2, line:'Chắp tay trước miếu, khấn điều mình mong.', go:'Khấn nguyện', btn:'Khấn nguyện', part:'altar', act:'pray' };
    case 'praying':  return { i:2, line:'Đang khấn nguyện...' };
    case 'prayed':   return { i:3, line:'Chờ mây tan, nắng lên.', go:'Mây tan, nắng lên', btn:'Mây tan, nắng lên', part:'sky', act:'clear' };
    case 'clearing': return { i:3, line:'Mây đang tan dần...' };
    case 'rise':     return { i:4, line:'Phiếu cầu nắng đang ra...', part:'box' };
    case 'ready':    return { i:4, line:'Phiếu đã ra – nhấn để nhận phiếu.', go:'Nhận phiếu', btn:'Nhận phiếu', part:'box', act:'take' };
    case 'taking':   return { i:4, line:'Đang nhận phiếu...' };
    case 'held':     return { i:4, line:'Đọc lời trên phiếu.', go:'Đọc phiếu', btn:'Đọc phiếu', part:'card', act:'read' };
    case 'reading':  return { i:4, line:'Đọc lời trên phiếu.' };
    case 'fade':     return { i:0, line:'Mây kéo về, miếu trở lại như cũ...' };
    default:         return { i:5, line:'Muốn cầu thêm? Cầu lại từ đầu.', go:'Cầu lại', btn:'Cầu lại', act:'again' };
  }
}
let cnJ = null, cnGlow = null;
function cnBuildJourney(){
  const back = document.createElement('a'); back.className = 'cnback'; back.href = '/'; back.textContent = '← Cổng chùa';
  cnJ = document.createElement('nav'); cnJ.className = 'cnj'; cnJ.setAttribute('aria-label', 'Các bước cầu nắng');
  cnJ.innerHTML = `<ol>${cnSteps.map((n, i) => `<li><b>${i + 1}</b><span>${n}</span></li>`).join('')}</ol>
    <div class="say"><p class="line" aria-live="polite"></p><button type="button" class="help">Hướng dẫn</button></div>
    <div class="dock"><button type="button" class="more" aria-expanded="false">Thêm</button><button type="button" class="go"></button></div>`;
  document.querySelector('.stage').before(back, cnJ);
  cnJ.querySelector('.help').onclick = () => cnWelcome(true);
  cnJ.querySelector('.go').onclick = () => cnNext();
  const more = cnJ.querySelector('.more');
  more.onclick = () => { const on = document.documentElement.classList.toggle('cnmore'); more.setAttribute('aria-expanded', on); };
  new ResizeObserver(() => document.documentElement.style.setProperty('--cnj-h', cnJ.offsetHeight + 'px')).observe(cnJ);
  cnGlow = document.createElementNS('http://www.w3.org/2000/svg', 'g'); cnGlow.id = 'cnglow';
  document.getElementById('fig').appendChild(cnGlow);
}
function cnDrawJourney(){
  const st = ui.st, s = cnStep(st);
  cnJ.querySelectorAll('li').forEach((li, i) => { li.className = i < s.i ? 'done' : i === s.i ? 'now' : ''; li.setAttribute('aria-current', i === s.i ? 'step' : 'false'); });
  const line = cnJ.querySelector('.line'); if (line.textContent !== s.line) line.textContent = s.line;
  const go = cnJ.querySelector('.go'); go.textContent = s.go || s.line; go.disabled = !s.act;
  for (const b of document.querySelectorAll('#btns .act')){ const on = !!s.btn && b.textContent.startsWith(s.btn); if (on !== b.hasAttribute('data-next')) b.toggleAttribute('data-next', on); }
  const at = s.part ? cnGlowAt[s.part] : null, key = at ? s.part + YAW + PITCH + VIEW : '';
  if (cnGlow.dataset.k !== key){ cnGlow.dataset.k = key;
    if (!at) cnGlow.innerHTML = '';
    else { const [X, Y] = P(...at), [X2, Y2] = P(at[0], at[1], at[2] + (s.part === 'sky' ? 20 : s.part === 'card' ? 22 : 11));
      cnGlow.innerHTML = `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(Math.hypot(X2 - X, Y2 - Y))}" stroke-width="${f(2.8*INK_K)}"/>`; } }
}

/* ---------- first visit: a short welcome card, shown again from Hướng dẫn ---------- */

/* ---------- the reading: one fixed line ---------- */
